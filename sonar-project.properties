# SonarQube project settings.
#
# The Jenkins pipeline passes projectKey, sources, and the coverage report path
# on the command line; anything it does not set is read from here.
#
# Coverage is produced by `runAll --coverage`, which measures the package and
# not the tests that drive it. Sonar scans the whole repository, so without
# this the test modules are counted as production code with no coverage at all,
# and every test added makes the reported figure worse rather than better.
sonar.coverage.exclusions=**/tests/**,**/setup.py,**/ci/**
